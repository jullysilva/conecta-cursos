name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  api:
    name: API (lint, unit, E2E, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: course
          POSTGRES_PASSWORD: course
          POSTGRES_DB: course_platform_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U course" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://course:course@localhost:5433/course_platform_test
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run test:cov
      - run: npm run test:e2e
      - run: npm run build

  web:
    name: Web (unit, build, bundle size)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:cov
      - run: npm run build
      - run: node scripts/check-bundle-size.mjs 100

  changes:
    name: Detect web changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'

  interface:
    name: Interface (Playwright + axe)
    needs: changes
    # Skipped (and reported as success) when the change does not touch web/.
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: course
          POSTGRES_PASSWORD: course
          POSTGRES_DB: course_platform_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U course" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      DATABASE_URL: postgresql://course:course@localhost:5433/course_platform_test
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - run: npm ci
        working-directory: api
      - run: npm ci
        working-directory: web
      - run: npm run e2e
        working-directory: web
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  deploy:
    name: Deploy (Vercel production)
    needs: [api, web, interface]
    # Only after a push/dispatch on main whose checks passed; a skipped interface job is fine.
    if: >-
      !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && needs.api.result == 'success' && needs.web.result == 'success'
      && needs.interface.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Deploys run one at a time, in merge order; none is cancelled halfway.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - run: npm ci
        working-directory: api
      - run: npm ci
        working-directory: web
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      # Schema first, so the new code never runs against an old database.
      - run: npx prisma migrate deploy
        working-directory: api
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      - run: node scripts/build-vercel-output.mjs
      - id: deploy
        run: echo "url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")" >> "$GITHUB_OUTPUT"
